<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工時日誌 & 打卡助理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 0.75rem; transition: all 0.2s; }
  </style>
</head>
<body class="min-h-screen pb-10 flex flex-col items-center p-4">

  <!-- Toast 提示視窗 -->
  <div id="toast" class="fixed top-4 bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg transition-opacity opacity-0 pointer-events-none z-50">
    已自動完成打卡！
  </div>

  <div class="w-full max-w-md space-y-4">
    <!-- Header -->
    <div class="flex justify-between items-center py-2 px-1">
      <div>
        <h1 class="text-xl font-black text-blue-400 tracking-wide flex items-center gap-2">
          ⏱️ 工時日誌
        </h1>
        <p class="text-xs text-slate-400">午休 12:00~13:30 自動扣除</p>
      </div>
      <div class="flex gap-2">
        <button onclick="openModal()" class="text-xs bg-blue-600/80 hover:bg-blue-600 text-white px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold">
          ＋ 補打卡
        </button>
        <button onclick="clearHistory()" class="text-xs text-rose-400 hover:text-rose-300 px-1 py-1 flex items-center gap-1">
          🗑️
        </button>
      </div>
    </div>

    <!-- 即時計時主卡片 -->
    <div class="glass-card rounded-3xl p-6 text-center shadow-2xl relative overflow-hidden">
      <div id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 mb-3">
        <span class="w-2 h-2 rounded-full bg-slate-500"></span> 尚未上班
      </div>
      
      <div id="timer" class="text-5xl font-black tracking-tight text-white my-2 font-mono">00:00:00</div>
      <p id="todayTotalText" class="text-xs text-slate-400 mt-1">今日扣除午休後計薪：0 小時</p>

      <button id="clockBtn" onclick="toggleClock()" 
              class="w-full mt-5 py-4 rounded-2xl text-white font-bold text-base shadow-lg transition-all active:scale-95 bg-blue-600 hover:bg-blue-500 flex items-center justify-center gap-2">
        ▶ 上班打卡
      </button>
    </div>

    <!-- 當月統計卡片 -->
    <div class="glass-card rounded-2xl p-4 flex justify-between items-center">
      <div>
        <span class="text-xs text-slate-400 block mb-1" id="currentMonthTitle">本月累積淨工時</span>
        <div class="text-2xl font-bold text-emerald-400" id="monthTotalHours">0.0 <span class="text-xs text-slate-300">小時</span></div>
      </div>
      <div class="text-right">
        <div class="flex items-center justify-end gap-1.5 mb-1">
          <span class="text-xs text-slate-400" id="salaryTitle">當月預估薪資</span>
          <button onclick="toggleSalaryVisibility()" class="p-0.5 hover:bg-slate-800 rounded transition-colors text-sm" title="顯示/隱藏資訊">
            <span id="salaryEyeIcon">👁️</span>
          </button>
        </div>
        <div class="text-xl font-bold text-amber-400" id="monthTotalSalary">$0</div>
      </div>
    </div>

    <!-- 月曆 -->
    <div class="glass-card rounded-3xl p-5 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 font-bold">◀</button>
        <span id="calendarMonthLabel" class="font-bold text-base text-slate-200">2026 年 10 月</span>
        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 font-bold">▶</button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-500 mb-2">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>

      <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
    </div>

    <!-- 打卡明細 -->
    <div class="glass-card rounded-2xl p-4">
      <h3 id="selectedDateTitle" class="text-xs font-bold text-slate-400 mb-3">打卡紀錄</h3>
      <div id="dayLogList" class="space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- 手動補打卡 Modal 彈窗 -->
  <div id="manualModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700/50 pb-3">
        <h3 class="font-bold text-slate-200">手動補打卡</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold text-base">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">日期</label>
          <input type="date" id="manualDate" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">上班時間</label>
            <input type="time" id="manualStartTime" value="09:00" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">下班時間</label>
            <input type="time" id="manualEndTime" value="18:00" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
          </div>
        </div>
        <p class="text-[10px] text-slate-400">系統將自動扣除跨越 12:00~13:30 之午休時數</p>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">取消</button>
        <button onclick="saveManualLog()" class="w-1/2 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs">儲存紀錄</button>
      </div>
    </div>
  </div>

  <script>
    const DAILY_RATE = 2000;
    const HOURLY_RATE = DAILY_RATE / 8; // 250 元/hr

    let startTime = localStorage.getItem('pt_startTime') ? new Date(localStorage.getItem('pt_startTime')) : null;
    let timerInterval = null;
    let currentViewDate = new Date();
    let selectedDateStr = formatDate(new Date());

    let isSalaryVisible = localStorage.getItem('pt_salary_visible') !== 'false';
    let currentCalculatedSalary = 0;

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function calculateNetHours(startDt, endDt) {
      if (endDt <= startDt) return 0;
      let totalMs = endDt - startDt;

      let lunchStart = new Date(startDt);
      lunchStart.setHours(12, 0, 0, 0);
      let lunchEnd = new Date(startDt);
      lunchEnd.setHours(13, 30, 0, 0);

      let overlapStart = new Date(Math.max(startDt.getTime(), lunchStart.getTime()));
      let overlapEnd = new Date(Math.min(endDt.getTime(), lunchEnd.getTime()));

      let deductionMs = 0;
      if (overlapEnd > overlapStart) {
        deductionMs = overlapEnd - overlapStart;
      }

      let netMs = Math.max(0, totalMs - deductionMs);
      return (netMs / (1000 * 60 * 60));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2500);
    }

    function toggleSalaryVisibility() {
      isSalaryVisible = !isSalaryVisible;
      localStorage.setItem('pt_salary_visible', isSalaryVisible);
      updateSalaryDisplay();
    }

    function updateSalaryDisplay() {
      const salaryEl = document.getElementById('monthTotalSalary');
      const salaryTitleEl = document.getElementById('salaryTitle');
      const eyeIconEl = document.getElementById('salaryEyeIcon');

      if (!salaryEl || !eyeIconEl) return;

      if (isSalaryVisible) {
        if (salaryTitleEl) salaryTitleEl.innerText = '當月預估薪資';
        salaryEl.innerText = `$${currentCalculatedSalary.toLocaleString()}`;
        eyeIconEl.innerText = '👁️';
      } else {
        if (salaryTitleEl) salaryTitleEl.innerText = '••••••';
        salaryEl.innerText = '••••••';
        eyeIconEl.innerText = '🙈';
      }
    }

    function updateDisplay() {
      const todayStr = formatDate(new Date());
      const logs = JSON.parse(localStorage.getItem('pt_logs') || '[]');
      let todayFinishedHours = logs
        .filter(l => l.date === todayStr)
        .reduce((sum, l) => sum + Number(l.hours), 0);

      if (!startTime) {
        document.getElementById('statusBadge').innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-500"></span> 尚未上班';
        document.getElementById('statusBadge').className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 mb-3";
        document.getElementById('timer').innerText = "00:00:00";
        document.getElementById('todayTotalText').innerText = `今日淨工時：${todayFinishedHours.toFixed(2)} 小時`;
        document.getElementById('clockBtn').innerText = "▶ 上班打卡";
        document.getElementById('clockBtn').className = "w-full mt-5 py-4 rounded-2xl text-white font-bold text-base shadow-lg transition-all active:scale-95 bg-blue-600 hover:bg-blue-500 flex items-center justify-center gap-2";
      } else {
        const now = new Date();
        const diffSec = Math.floor((now - startTime) / 1000);
        const hrs = String(Math.floor(diffSec / 3600)).padStart(2, '0');
        const mins = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
        const secs = String(diffSec % 60).padStart(2, '0');

        const currentShiftNetHours = calculateNetHours(startTime, now);
        const totalToday = todayFinishedHours + currentShiftNetHours;

        document.getElementById('statusBadge').innerHTML
