<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT 打卡助理</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6 mt-4">
    <!-- 標題與時薪設定 -->
    <div class="flex justify-between items-center border-b pb-4">
      <h1 class="text-xl font-bold text-slate-800">⏱️ PT 打卡計數器</h1>
      <div class="flex items-center space-x-1">
        <span class="text-xs text-slate-500">時薪 $</span>
        <input id="rateInput" type="number" value="190" onchange="updateRate()" 
               class="w-16 border rounded px-2 py-1 text-sm font-semibold text-right">
      </div>
    </div>

    <!-- 即時狀態 display -->
    <div class="text-center py-4 bg-slate-50 rounded-xl border border-slate-200">
      <div id="statusBadge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-600 mb-2">
        尚未上班
      </div>
      <div id="timer" class="text-4xl font-extrabold text-slate-800 tracking-wider">00:00:00</div>
      <div id="salary" class="text-sm font-semibold text-emerald-600 mt-2">預計薪資：$0 元</div>
    </div>

    <!-- 打卡按鈕 -->
    <button id="clockBtn" onclick="toggleClock()" 
            class="w-full py-4 rounded-xl text-white font-bold text-lg shadow-md transition-all active:scale-95 bg-blue-600 hover:bg-blue-700">
      上班打卡
    </button>

    <!-- 歷史紀錄 -->
    <div>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">出勤紀錄</h2>
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">清空紀錄</button>
      </div>
      <div id="historyList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <script>
    let hourlyRate = Number(localStorage.getItem('pt_rate')) || 190;
    document.getElementById('rateInput').value = hourlyRate;

    let startTime = localStorage.getItem('pt_startTime') ? new Date(localStorage.getItem('pt_startTime')) : null;
    let timerInterval = null;

    function updateRate() {
      hourlyRate = Number(document.getElementById('rateInput').value) || 190;
      localStorage.setItem('pt_rate', hourlyRate);
      if (startTime) updateDisplay();
    }

    function updateDisplay() {
      if (!startTime) {
        document.getElementById('statusBadge').innerText = "尚未上班";
        document.getElementById('statusBadge').className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-600 mb-2";
        document.getElementById('timer').innerText = "00:00:00";
        document.getElementById('salary').innerText = "預計薪資：$0 元";
        document.getElementById('clockBtn').innerText = "上班打卡";
        document.getElementById('clockBtn').className = "w-full py-4 rounded-xl text-white font-bold text-lg shadow-md transition-all active:scale-95 bg-blue-600 hover:bg-blue-700";
        return;
      }

      const now = new Date();
      const diffSec = Math.floor((now - startTime) / 1000);
      
      const hrs = String(Math.floor(diffSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
      const secs = String(diffSec % 60).padStart(2, '0');

      const hoursWorked = diffSec / 3600;
      const salary = Math.round(hoursWorked * hourlyRate);

      document.getElementById('statusBadge').innerText = `上班中 (${startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} 上班)`;
      document.getElementById('statusBadge').className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 mb-2";
      document.getElementById('timer').innerText = `${hrs}:${mins}:${secs}`;
      document.getElementById('salary').innerText = `預計薪資：$${salary} 元`;
      document.getElementById('clockBtn').innerText = "下班打卡";
      document.getElementById('clockBtn').className = "w-full py-4 rounded-xl text-white font-bold text-lg shadow-md transition-all active:scale-95 bg-rose-600 hover:bg-rose-700";
    }

    function toggleClock() {
      if (!startTime) {
        startTime = new Date();
        localStorage.setItem('pt_startTime', startTime.toISOString());
        timerInterval = setInterval(updateDisplay, 1000);
      } else {
        const endTime = new Date();
        const diffSec = Math.floor((endTime - startTime) / 1000);
        const hoursWorked = (diffSec / 3600).toFixed(2);
        const salary = Math.round(hoursWorked * hourlyRate);

        const record = {
          date: startTime.toLocaleDateString(),
          time: `${startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ~ ${endTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`,
          hours: hoursWorked,
          salary: salary
        };

        let logs = JSON.parse(localStorage.getItem('pt_logs') || '[]');
        logs.unshift(record);
        localStorage.setItem('pt_logs', JSON.stringify(logs));

        localStorage.removeItem('pt_startTime');
        startTime = null;
        clearInterval(timerInterval);
        renderLogs();
      }
      updateDisplay();
    }

    function renderLogs() {
      const logs = JSON.parse(localStorage.getItem('pt_logs') || '[]');
      const container = document.getElementById('historyList');
      if (logs.length === 0) {
        container.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">暫無打卡紀錄</div>';
        return;
      }
      container.innerHTML = logs.map(log => `
        <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs">
          <div>
            <div class="font-bold text-slate-700">${log.date}</div>
            <div class="text-slate-500">${log.time} (${log.hours} 小時)</div>
          </div>
          <div class="font-bold text-emerald-600 text-sm">$${log.salary}</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm("確定要清空所有紀錄嗎？")) {
        localStorage.removeItem('pt_logs');
        renderLogs();
      }
    }

    if (startTime) timerInterval = setInterval(updateDisplay, 1000);
    updateDisplay();
    renderLogs();
  </script>
</body>
</html>
